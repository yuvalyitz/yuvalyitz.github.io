<a href="/sitemap/">Sitemap</a>

<script src="{{ '/assets/photoswipe/dist/umd/photoswipe.umd.min.js' | relative_url }}"></script>
<script src="{{ '/assets/photoswipe/dist/umd/photoswipe-lightbox.umd.min.js' | relative_url }}"></script>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/justifiedGallery@3.8.1/dist/js/jquery.justifiedGallery.min.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (typeof window.jQuery === 'undefined' || !$('#gallery').length) {
      return;
    }

    $('#gallery').justifiedGallery({
      rowHeight: 260,
      lastRow: 'nojustify',
      margins: 8
    }).on('jg.complete', function () {
      const lightbox = new PhotoSwipeLightbox({
        gallery: '#gallery',
        children: 'a',
        childSelector: '.pswp-gallery__item',
        pswpModule: PhotoSwipe,
        paddingFn: () => ({ top: 30, bottom: 30, left: 70, right: 70 }),
        captionContent: (slide) => slide.data?.pswpCaption || ''
      });

      lightbox.on('uiRegister', function () {
        lightbox.pswp.ui.registerElement({
          name: 'custom-caption',
          order: 9,
          isButton: false,
          appendTo: 'root',
          html: '',
          onInit: (el, pswp) => {
            pswp.on('change', () => {
              const currSlide = pswp.currSlide;
              el.innerHTML = currSlide.data?.pswpCaption || '';
            });
          }
        });
      });

      if (typeof window.PhotoSwipeDynamicCaption !== 'undefined') {
        new PhotoSwipeDynamicCaption(lightbox, { type: 'auto' });
      }

      lightbox.init();
    });
  });
</script>
<!-- end custom footer snippets -->
